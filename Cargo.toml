[package]
name = "cherry-quickjs"
version = "0.0.1"
edition = "2024"

[dependencies]
rquickjs = { version = "0.12.2", features = ["loader"] }
wasmi = "1.1.0"
wasmi_wasi = "1.1.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[build-dependencies]
rquickjs = { version = "0.12.2", features = ["loader"] }
