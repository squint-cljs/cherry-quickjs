name: Build choq

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            platform: linux
          - os: ubuntu-24.04-arm
            arch: aarch64
            platform: linux
          - os: macos-latest
            arch: aarch64
            platform: macos
          - os: macos-15-intel
            arch: amd64
            platform: macos
          - os: windows-latest
            arch: amd64
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install cherry-cljs
        run: pnpm install --frozen-lockfile

      - name: Version
        shell: bash
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release

      - name: Smoke test
        shell: bash
        run: |
          out=$(./target/release/choq -e '(str "ch" "oq")')
          echo "$out"
          test "$out" = '"choq"'

      - name: Run tests
        shell: bash
        run: |
          ./target/release/choq test/nrepl_test.cljs
          ./target/release/choq test/stream_test.cljs

      - name: Package binary (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: tar czf choq-$VERSION-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C target/release choq

      - name: Package binary (windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: 7z a choq-$VERSION-${{ matrix.platform }}-${{ matrix.arch }}.zip ./target/release/choq.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: choq-${{ matrix.platform }}-${{ matrix.arch }}
          path: choq-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.platform == 'windows' && 'zip' || 'tar.gz' }}

  release:
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create or update dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Development Build
          prerelease: true
          make_latest: false
          files: |
            choq-*.tar.gz
            choq-*.zip
          body: |
            Rolling development build of choq.

            ```sh
            tar xzf choq-<version>-<platform>-<arch>.tar.gz
            ./choq -e '(+ 1 2 3)'
            ```

      - name: Prune old release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view dev -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            if [ ! -f "$asset" ]; then
              gh release delete-asset dev "$asset" -R "$GITHUB_REPOSITORY" -y
            fi
          done
